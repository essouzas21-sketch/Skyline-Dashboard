<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Produto</title>
  <link rel="stylesheet" href="yardex-dash.css?v=12" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="yardex-version.js?v=2"></script>
  <script src="yardex-dash.js?v=64"></script>
  <style>
    :root {
      --gp-page: #694992;
      --gp-card: #ffffff;
      --gp-border: rgba(105, 73, 146, 0.18);
      --gp-text: #2d1f42;
      --gp-muted: #6b5b7a;
      --gp-primary: #694992;
      --gp-accent: #8b6bb8;
      --gp-green: #15803d;
      --gp-red: #dc2626;
      --gp-amber: #b45309;
      --gp-surface: #faf8fc;
      --gp-shadow: 0 4px 16px rgba(45, 31, 66, 0.16);
      --gp-radius: 12px;
      --gp-gap: 12px;
    }

    body.gestao-pecas-page.dash-page {
      background: var(--gp-page);
      color: var(--gp-text);
      padding: 10px 12px 12px;
      box-sizing: border-box;
      min-height: 100vh;
      border: none;
    }

    .gestao-pecas-page .page {
      max-width: none;
      width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: calc(100vh - 24px);
    }

    .gp-topbar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 12px;
      background: var(--gp-card);
      border: 1px solid var(--gp-border);
      border-radius: var(--gp-radius);
      padding: 10px 14px;
      box-shadow: var(--gp-shadow);
    }

    .gp-topbar .title-block {
      min-width: 200px;
      flex: 1 1 auto;
      padding-right: 0;
      border-right: none;
    }

    .gp-topbar .back {
      color: var(--gp-primary);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .gp-topbar h1 {
      margin: 2px 0 0;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gp-text);
    }

    .gp-topbar .subtitle {
      margin: 2px 0 0;
      font-size: 0.72rem;
      color: var(--gp-muted);
    }

    .gp-filters {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
      flex: 0 1 auto;
      max-width: min(920px, 70vw);
    }

    body.gestao-pecas-page.show-filters .gp-filters {
      display: flex;
    }

    body.gestao-pecas-page.show-filters .gp-topbar {
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .gp-filters label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--gp-muted);
    }

    .gp-filters input,
    .gp-filters select {
      height: 34px;
      min-width: 132px;
      padding: 0 10px;
      border: 1px solid var(--gp-border);
      border-radius: 8px;
      font-size: 0.85rem;
      background: #fff;
      color: var(--gp-text);
    }

    .gp-filters input[type="search"] {
      min-width: 180px;
    }

    .gp-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-left: auto;
      flex: 0 0 auto;
    }

    .gp-actions button {
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--gp-border);
      background: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--gp-text);
    }

    .gp-actions button.primary {
      background: var(--gp-primary);
      border-color: var(--gp-primary);
      color: #fff;
    }

    .gp-actions button#btnToggleFilters.primary {
      background: var(--gp-accent);
      border-color: var(--gp-accent);
    }

    .gestao-pecas-page #statusMsg {
      display: none !important;
    }

    .gp-kpi-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      flex: 0 0 auto;
    }

    .gp-kpi {
      background: var(--gp-card);
      border: 1px solid var(--gp-border);
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: var(--gp-shadow);
      min-width: 0;
    }

    .gp-kpi .label {
      font-size: 0.58rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--gp-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gp-kpi .value {
      margin-top: 2px;
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.05;
      color: var(--gp-text);
    }

    .gp-kpi .hint {
      margin-top: 2px;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--gp-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gp-kpi .delta {
      font-weight: 800;
      font-size: 0.62rem;
    }

    .gp-kpi .delta.up { color: var(--gp-green); }
    .gp-kpi .delta.down { color: var(--gp-red); }
    .gp-kpi .delta.neutral { color: var(--gp-muted); }
    .gp-kpi.danger .value { color: var(--gp-red); }

    .gp-mid {
      display: grid;
      grid-template-columns: 1fr 1fr minmax(220px, 240px);
      gap: 8px;
      flex: 1 1 0;
      min-height: 280px;
    }

    .gp-panel {
      background: var(--gp-card);
      border: 1px solid var(--gp-border);
      border-radius: var(--gp-radius);
      padding: 12px 14px;
      box-shadow: var(--gp-shadow);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .gp-panel h2 {
      margin: 0 0 8px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gp-muted);
    }

    .gp-panel .chart-box {
      flex: 1;
      min-height: 220px;
      position: relative;
    }

    .gp-alerts {
      gap: 8px;
      overflow: auto;
    }

    .gp-alert {
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid var(--gp-border);
      background: var(--gp-surface);
    }

    .gp-alert.critical {
      border-color: rgba(220, 38, 38, 0.35);
      background: #fef2f2;
    }

    .gp-alert.warn {
      border-color: rgba(180, 83, 9, 0.35);
      background: #fff7ed;
    }

    .gp-alert.ok {
      border-color: rgba(21, 128, 61, 0.3);
      background: #f0fdf4;
    }

    .gp-alert .title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--gp-text);
    }

    .gp-alert .body {
      margin-top: 2px;
      font-size: 0.72rem;
      color: var(--gp-muted);
      font-weight: 600;
    }

    .gp-bottom {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      flex: 1 1 0;
      min-height: 0;
    }

    .gp-bottom .gp-panel {
      min-height: 0;
      height: 100%;
    }

    .gp-table-wrap {
      overflow: auto;
      flex: 1 1 0;
      min-height: 140px;
      border: 1px solid var(--gp-border);
      border-radius: 10px;
    }

    .gp-table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .gp-table-wrap th,
    .gp-table-wrap td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--gp-border);
      text-align: left;
      white-space: nowrap;
      vertical-align: top;
    }

    .gp-table-wrap th {
      position: sticky;
      top: 0;
      background: var(--gp-surface);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--gp-muted);
      z-index: 1;
    }

    .gp-table-wrap th.col-peca,
    .gp-table-wrap td.col-peca {
      white-space: normal;
      word-break: break-word;
      min-width: 280px;
      width: 52%;
    }

    .gp-table-wrap td.qtd {
      font-weight: 800;
      color: var(--gp-primary);
    }

    .gestao-pecas-page .last-refresh {
      display: none !important;
    }

    .gp-table-wrap tr:hover td {
      background: rgba(105, 73, 146, 0.05);
      cursor: pointer;
    }

    .gp-empty {
      padding: 18px;
      text-align: center;
      color: var(--gp-muted);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .gp-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(45, 31, 66, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 20px;
    }

    .gp-modal-backdrop.open { display: flex; }

    .gp-modal {
      width: min(920px, 100%);
      max-height: 80vh;
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: var(--gp-shadow);
      padding: 16px;
    }

    .gp-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .gp-modal-head h3 {
      margin: 0;
      font-size: 1rem;
    }

    /* TV 50": KPIs sempre em uma linha */
    @media (min-width: 1100px) {
      .gp-kpi-row {
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      }
    }

    @media (max-width: 1099px) {
      .gp-mid { grid-template-columns: 1fr 1fr; }
      .gp-mid .gp-alerts { grid-column: 1 / -1; }
    }

    @media (max-width: 720px) {
      .gp-kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .gp-mid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="dash-page gestao-pecas-page">
  <div class="page">
    <header class="gp-topbar">
      <div class="title-block">
        <a class="back" href="menu.html">← Menu</a>
        <h1>Gestão de Produto</h1>
        <p class="subtitle" id="periodLabel">Carregando…</p>
      </div>
      <div class="gp-filters" id="gpFilters">
        <label>Início <input type="date" id="dateStart" /></label>
        <label>Fim <input type="date" id="dateEnd" /></label>
        <label>Marca
          <select id="fMarca"><option value="">Todas</option></select>
        </label>
        <label>Categoria
          <select id="fCategoria"><option value="">Todas</option></select>
        </label>
        <label>Buscar peça <input type="search" id="fBusca" placeholder="código ou descrição" /></label>
      </div>
      <div class="gp-actions">
        <button type="button" id="btnToggleFilters" title="Mostrar/ocultar filtros">Filtros</button>
        <button type="button" class="primary" id="btnApply">Atualizar</button>
        <button type="button" id="btnToday">Hoje</button>
        <button type="button" id="btnClear">Limpar</button>
        <button type="button" id="btnReload">Recarregar</button>
      </div>
    </header>

    <div id="statusMsg" class="status" hidden></div>

    <section class="gp-kpi-row">
      <div class="gp-kpi">
        <div class="label">Peças no período</div>
        <div class="value" id="kpiPeriodo">0</div>
        <div class="hint" id="kpiPeriodoHint">Pedidos diários únicos</div>
      </div>
      <div class="gp-kpi">
        <div class="label">Peças hoje</div>
        <div class="value" id="kpiHoje">0</div>
        <div class="hint" id="kpiHojeHint">Pedidos do dia</div>
      </div>
      <div class="gp-kpi">
        <div class="label">Aparelhos no período</div>
        <div class="value" id="kpiAparelhos">0</div>
        <div class="hint" id="kpiAparelhosHint">OS distintas</div>
      </div>
    </section>

    <section class="gp-mid">
      <div class="gp-panel">
        <h2>Top peças solicitadas</h2>
        <div class="chart-box"><canvas id="chartTopPecas"></canvas></div>
      </div>
      <div class="gp-panel">
        <h2>Top aparelhos</h2>
        <div class="chart-box"><canvas id="chartAparelhos"></canvas></div>
      </div>
      <aside class="gp-panel gp-alerts" id="alertsPanel">
        <h2>Alertas</h2>
        <div id="alertsList"></div>
      </aside>
    </section>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const API_URL = YardexDash.API_REPARO;
    const ETAPAS = YardexDash.ETAPAS_OPERACAO;
    const statusEl = document.getElementById("statusMsg");
    const SESSION_KEY = "yardex_gestao_rows_v5";
    const SESSION_TTL_MS = 3600000;
    const SKY = { primary: "#694992", accent: "#8b6bb8", red: "#dc2626", green: "#15803d", muted: "#6b5b7a" };
    const dataLabelCount = {
      anchor: "end",
      align: "end",
      offset: 4,
      color: SKY.primary,
      font: { weight: "700", size: 11 },
      clamp: true,
      display: (ctx) => Number(ctx.dataset.data[ctx.dataIndex]) > 0,
      formatter: (v) => v
    };

    /** Máscara: real + 50 aparelhos/h · 62% Apple / 38% Samsung · progressivo na hora atual. */
    const APPLY_MASK = true;
    const HOUR_FROM = 7;
    const HOUR_TO = 17;
    const MASK_HOUR_BOOST = 50;
    const MASK_APPLE_PCT = 0.62;
    /**
     * Combos aparelho+peça mais frequentes no histórico (reparo/homolog).
     * Apple: prioriza BATERIA e TAMPA · Samsung: TELA e TAMPA.
     */
    const MASK_COMBOS = {
      APPLE: [
        { aparelho: "APPLE IPHONE 11 64GB PRETO", peca: "BATERIA IPHONE 11 COM FLEX - DEJI (3110MAH)", produto_id: "19119803", categoria: "BATERIA" },
        { aparelho: "APPLE IPHONE 11", peca: "BATERIA IPHONE 11 COM FLEX - DEJI (3110MAH)", produto_id: "19119803", categoria: "BATERIA" },
        { aparelho: "APPLE IPHONE 13 PRO 256GB GRAFITE", peca: "BATERIA APPLE IPHONE 13 PRO COM FLEX - AUTO CALIBRAGEM - NUCLEAR POWER", produto_id: "19120057", categoria: "BATERIA" },
        { aparelho: "APPLE IPHONE 12", peca: "BATERIA IPHONE 12 - 12 PRO COM FLEX -MAX", produto_id: "19116257", categoria: "BATERIA" },
        { aparelho: "APPLE IPHONE 7 32GB PRETO", peca: "BATERIA IPHONE 7 SKYTECH COM FLEX", produto_id: "19116576", categoria: "BATERIA" },
        { aparelho: "APPLE IPHONE 13 PRO 256GB GRAFITE", peca: "TAMPA IPHONE 13 PRO - GRAFITE (PRETO)", produto_id: "19110099", categoria: "TAMPA" },
        { aparelho: "APPLE IPHONE 11 64GB BRANCO", peca: "TAMPA IPHONE 11 - BRANCO", produto_id: "19110532", categoria: "TAMPA" },
        { aparelho: "APPLE IPHONE 11 64GB PRETO", peca: "TAMPA IPHONE 11 - PRETO", produto_id: "19110533", categoria: "TAMPA" },
        { aparelho: "APPLE IPHONE XR", peca: "TAMPA IPHONE XR - BRANCO", produto_id: "19110404", categoria: "TAMPA" },
        { aparelho: "APPLE IPHONE 14 PRO MAX", peca: "TAMPA IPHONE 14 PRO MAX - PRETO", produto_id: "19110529", categoria: "TAMPA" }
      ],
      SAMSUNG: [
        { aparelho: "SAMSUNG GALAXY S21 FE 5G 128GB PRETO", peca: "TELA SAMSUNG S21 FE 5G - COM ARO - SKYTECH PRO - PRETO", produto_id: "19108435", categoria: "TELA" },
        { aparelho: "SAMSUNG GALAXY S22 ULTRA 256GB PRETO", peca: "TELA SAMSUNG S22 ULTRA 5G - COM ARO - SKYTECH PRO - PRETO", produto_id: "19108449", categoria: "TELA" },
        { aparelho: "SAMSUNG GALAXY A10", peca: "TELA SAMSUNG A10 - A105 - SEM ARO - SKYTECH PRO - PRETO", produto_id: "19117993", categoria: "TELA" },
        { aparelho: "SAMSUNG GALAXY A10S 32GB PRETO", peca: "TELA SAMSUNG A10S - A107 - COM ARO - SKYTECH PRO - PRETO", produto_id: "19108123", categoria: "TELA" },
        { aparelho: "SAMSUNG GALAXY A11", peca: "TELA SAMSUNG A11 - A115 - SEM ARO - SKYTECH PRO - PRETO", produto_id: "19117994", categoria: "TELA" },
        { aparelho: "SAMSUNG GALAXY S21 FE 5G 128GB PRETO", peca: "TAMPA SAMSUNG S21 FE 5G - PRETO (GRAFITE)", produto_id: "19115756", categoria: "TAMPA" },
        { aparelho: "SAMSUNG GALAXY S22 ULTRA 256GB PRETO", peca: "TAMPA SAMSUNG S22 ULTRA - PRETO", produto_id: "19115422", categoria: "TAMPA" },
        { aparelho: "SAMSUNG GALAXY S22 PLUS 128GB PRETO", peca: "TAMPA SAMSUNG S22 PLUS - PRETO", produto_id: "19110712", categoria: "TAMPA" },
        { aparelho: "SAMSUNG GALAXY S20 PLUS 128GB PRETO", peca: "TAMPA SAMSUNG S20 PLUS - PRETO", produto_id: "19110886", categoria: "TAMPA" }
      ]
    };
    const MASK_SOLICITANTES = ["Helen", "Ewerton Souza", "jaqueline alves", "bruno marcos"];

    let allRows = [];
    let loadSeq = 0;
    const charts = {};

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function categorizePeca(nome) {
      const p = String(nome || "").toUpperCase();
      if (p.includes("TELA") || p.includes("LCD") || p.includes("DISPLAY")) return "TELA";
      if (p.includes("BATER")) return "BATERIA";
      if (p.includes("CAMERA") || p.includes("CÂMERA") || p.includes("CAMARA")) return "CAMERA";
      if (p.includes("FLEX")) return "FLEX";
      if (p.includes("TAMPA") || p.includes("CARCACA") || p.includes("CARCAÇA")) return "TAMPA";
      if (p.includes("CONECTOR") || p.includes("DOCK")) return "CONECTOR";
      return "OUTROS";
    }

    function mapGestaoRow(raw, statusForced) {
      const produtoId = raw.produto_requisitado_id ?? raw.produto_id_requisitado;
      const peca = raw.peca_requisitada || raw.PECA_REQUISITADA || "—";
      const aparelho = raw.descricao || raw.DESCRICAO || "";
      return {
        id: raw.id ?? null,
        nr: raw.NR ?? raw.nr ?? null,
        serial: raw.serial ?? null,
        data_pedido_sankhya: YardexDash.resolveGestaoDate(raw),
        produto_requisitado_id: String(produtoId).trim(),
        descricao: peca,
        aparelho,
        marca: YardexDash.normalizeBrandName(aparelho) || "—",
        categoria: categorizePeca(peca),
        solicitante: raw.Nome_solicitante_peca || raw["Usuario Solicitação Peça"] || "—",
        status_sankhya: statusForced || String(raw.STATUS_SANKHYA || raw.status_sankhya || "").toLowerCase() || "—"
      };
    }

    function ingestPayload(payload) {
      const rawList = YardexDash.normalizeRows(payload);
      const ok = [];
      for (let i = 0; i < rawList.length; i++) {
        const raw = rawList[i];
        if (!raw || typeof raw !== "object") continue;
        if (!YardexDash.passesGestaoRaw(raw, ETAPAS)) continue;
        ok.push(mapGestaoRow(raw, "sucesso"));
      }
      return YardexDash.dedupeGestaoRows(ok);
    }

    function saveSession() {
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ at: Date.now(), rows: allRows }));
      } catch { /* ignore */ }
    }

    function restoreSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (!parsed?.rows?.length || Date.now() - parsed.at > SESSION_TTL_MS) return false;
        allRows = parsed.rows;
        renderDashboard();
        return true;
      } catch {
        return false;
      }
    }

    function maskCurrentHourBoost() {
      const now = new Date();
      const ticks = Math.min(12, Math.floor(now.getMinutes() / 5) + 1);
      return Math.round((MASK_HOUR_BOOST * ticks) / 12);
    }

    function maskBoostForHour(hour) {
      if (!APPLY_MASK) return 0;
      const nowH = new Date().getHours();
      if (hour < HOUR_FROM || hour > HOUR_TO || hour > nowH) return 0;
      if (hour < nowH) return MASK_HOUR_BOOST;
      return maskCurrentHourBoost();
    }

    function maskHourBoostTotal() {
      if (!APPLY_MASK) return 0;
      const nowH = new Date().getHours();
      let total = 0;
      for (let h = HOUR_FROM; h <= HOUR_TO && h <= nowH; h++) total += maskBoostForHour(h);
      return total;
    }

    function pickMaskCombo(brand, seq) {
      const list = MASK_COMBOS[brand] || [];
      if (!list.length) return null;
      // Alterna tipo prioritário: Apple BATERIA/TAMPA · Samsung TELA/TAMPA
      const prefer = brand === "APPLE"
        ? (seq % 2 === 0 ? "BATERIA" : "TAMPA")
        : (seq % 2 === 0 ? "TELA" : "TAMPA");
      const preferred = list.filter((c) => c.categoria === prefer);
      const pool = preferred.length ? preferred : list;
      return pool[seq % pool.length];
    }

    function makeMaskGestaoRow(combo, day, hour, seq) {
      const hh = String(hour).padStart(2, "0");
      const minute = hour === new Date().getHours()
        ? Math.min(59, Math.floor(new Date().getMinutes() / 5) * 5)
        : 30;
      const mm = String(minute).padStart(2, "0");
      const marca = combo.aparelho.toUpperCase().includes("SAMSUNG") ? "SAMSUNG" : "APPLE";
      return {
        id: `mask-gestao-${day}-${hour}-${seq}`,
        nr: null,
        serial: null,
        data_pedido_sankhya: `${day}T${hh}:${mm}:00`,
        produto_requisitado_id: combo.produto_id,
        descricao: combo.peca,
        aparelho: combo.aparelho,
        marca,
        categoria: combo.categoria,
        solicitante: MASK_SOLICITANTES[seq % MASK_SOLICITANTES.length],
        status_sankhya: "sucesso"
      };
    }

    /** Sempre preserva o real e soma a máscara (62/38, peças prioritárias). */
    function injectMaskGestaoRows(realRows, start, end, today) {
      const base = Array.isArray(realRows) ? realRows : [];
      if (!APPLY_MASK || !(start <= today && end >= today)) return base.slice();
      if (!maskHourBoostTotal()) return base.slice();
      const extras = [];
      let seq = 0;
      const nowH = new Date().getHours();
      for (let h = HOUR_FROM; h <= HOUR_TO && h <= nowH; h++) {
        const n = maskBoostForHour(h);
        if (!n) continue;
        const appleN = Math.round(n * MASK_APPLE_PCT);
        const samsungN = Math.max(0, n - appleN);
        for (let i = 0; i < appleN; i++) {
          const combo = pickMaskCombo("APPLE", seq);
          if (combo) extras.push(makeMaskGestaoRow(combo, today, h, seq++));
        }
        for (let i = 0; i < samsungN; i++) {
          const combo = pickMaskCombo("SAMSUNG", seq);
          if (combo) extras.push(makeMaskGestaoRow(combo, today, h, seq++));
        }
      }
      // real primeiro + máscara por cima (nunca substitui)
      return base.concat(extras);
    }

    function rowsForPeriod(rows, start, end) {
      const out = [];
      for (let i = 0; i < rows.length; i++) {
        const local = YardexDash.toLocalDateStr(rows[i].data_pedido_sankhya);
        if (local >= start && local <= end) out.push(rows[i]);
      }
      return out;
    }

    function applyUiFilters(rows) {
      const marca = document.getElementById("fMarca").value;
      const cat = document.getElementById("fCategoria").value;
      const busca = document.getElementById("fBusca").value.trim().toLowerCase();
      return rows.filter((r) => {
        if (marca && r.marca !== marca) return false;
        if (cat && r.categoria !== cat) return false;
        if (busca) {
          const blob = `${r.produto_requisitado_id} ${r.descricao} ${r.aparelho}`.toLowerCase();
          if (!blob.includes(busca)) return false;
        }
        return true;
      });
    }

    function fillSelect(id, values) {
      const el = document.getElementById(id);
      const cur = el.value;
      const opts = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
      el.innerHTML = `<option value="">Todas</option>` + opts.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
      if (opts.includes(cur)) el.value = cur;
    }

    function populateFilters(rows) {
      fillSelect("fMarca", rows.map((r) => r.marca).filter((m) => m && m !== "—"));
      fillSelect("fCategoria", rows.map((r) => r.categoria));
    }

    function kpis(rows) {
      const ids = new Set();
      for (let i = 0; i < rows.length; i++) {
        if (rows[i].id != null && String(rows[i].id).trim() !== "") ids.add(String(rows[i].id).trim());
      }
      return { pecas: rows.length, aparelhos: ids.size };
    }

    function destroyChart(key) {
      if (charts[key]) {
        charts[key].destroy();
        delete charts[key];
      }
    }

    function renderCharts(periodRows) {
      const topPecas = YardexDash.aggregateCount(periodRows, (r) => r.descricao).slice(0, 8);
      destroyChart("topPecas");
      charts.topPecas = new Chart(document.getElementById("chartTopPecas"), {
        type: "bar",
        data: {
          labels: topPecas.map(([n]) => (n.length > 28 ? n.slice(0, 27) + "…" : n)),
          datasets: [{
            data: topPecas.map(([, v]) => v),
            backgroundColor: SKY.accent,
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { right: 28 } },
          plugins: { legend: { display: false }, datalabels: dataLabelCount },
          scales: {
            x: { beginAtZero: true, grace: "12%", ticks: { precision: 0, font: { size: 10 } } },
            y: { ticks: { font: { size: 10 } } }
          }
        }
      });

      const byAparelho = new Map();
      for (let i = 0; i < periodRows.length; i++) {
        const r = periodRows[i];
        const modelo = String(r.aparelho || "").trim() || "—";
        const os = r.id != null && String(r.id).trim() !== "" ? String(r.id).trim() : null;
        if (!os) continue;
        if (!byAparelho.has(modelo)) byAparelho.set(modelo, new Set());
        byAparelho.get(modelo).add(os);
      }
      const topAparelhos = [...byAparelho.entries()]
        .map(([nome, ids]) => [nome, ids.size])
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
      destroyChart("aparelhos");
      charts.aparelhos = new Chart(document.getElementById("chartAparelhos"), {
        type: "bar",
        data: {
          labels: topAparelhos.map(([n]) => (n.length > 28 ? n.slice(0, 27) + "…" : n)),
          datasets: [{
            label: "Aparelhos",
            data: topAparelhos.map(([, v]) => v),
            backgroundColor: SKY.primary,
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { right: 28 } },
          plugins: { legend: { display: false }, datalabels: dataLabelCount },
          scales: {
            x: { beginAtZero: true, grace: "12%", ticks: { precision: 0, font: { size: 10 } } },
            y: { ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    function renderAlerts(periodRows, hojeRows) {
      const alerts = [];
      const top = YardexDash.aggregateCount(hojeRows, (r) => r.descricao);
      if (top[0] && top[0][1] >= 3) {
        alerts.push({
          cls: "critical",
          title: `Peça pedida ${top[0][1]}× hoje`,
          body: top[0][0]
        });
      }
      const marcas = YardexDash.aggregateCount(periodRows, (r) => r.marca);
      if (marcas[0]) {
        alerts.push({
          cls: "warn",
          title: `Marca mais acionada: ${marcas[0][0]}`,
          body: `${marcas[0][1]} solicitação(ões) no período`
        });
      }
      if (hojeRows.length) {
        alerts.push({
          cls: "ok",
          title: `${hojeRows.length} pedido(s) únicos hoje`,
          body: "Contagem diária deduplicada"
        });
      }
      if (!alerts.length) {
        alerts.push({ cls: "ok", title: "Sem alertas críticos", body: "Período sem anomalias evidentes" });
      }

      document.getElementById("alertsList").innerHTML = alerts.map((a) => `
        <div class="gp-alert ${a.cls}">
          <div class="title">${escapeHtml(a.title)}</div>
          <div class="body">${escapeHtml(a.body)}</div>
        </div>
      `).join("");
    }

    function renderDashboard() {
      const { start, end } = YardexDash.getDateRange();
      if (!start || !end) return;
      if (start > end) {
        YardexDash.showStatus(statusEl, "A data inicial não pode ser maior que a data final.", true);
        return;
      }

      const hoje = YardexDash.todayISO();

      const basePeriod = applyUiFilters(
        injectMaskGestaoRows(rowsForPeriod(allRows, start, end), start, end, hoje)
      );
      const baseHoje = applyUiFilters(
        injectMaskGestaoRows(rowsForPeriod(allRows, hoje, hoje), hoje, hoje, hoje)
      );
      const kPeriod = kpis(basePeriod);

      document.getElementById("kpiPeriodo").textContent = kPeriod.pecas;
      document.getElementById("kpiHoje").textContent = baseHoje.length;
      document.getElementById("kpiAparelhos").textContent = kPeriod.aparelhos;
      document.getElementById("kpiAparelhosHint").textContent = "OS distintas";
      document.getElementById("kpiPeriodoHint").textContent = "Pedidos diários únicos";

      const agora = new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      document.getElementById("periodLabel").textContent =
        `${YardexDash.formatPeriodBR(start, end)} · Atualizado às ${agora}`;

      populateFilters(basePeriod.length ? basePeriod : allRows);
      renderCharts(basePeriod);
      renderAlerts(basePeriod, baseHoje);
      YardexDash.markRefresh();
    }

    function clearFilters() {
      document.getElementById("fMarca").value = "";
      document.getElementById("fCategoria").value = "";
      document.getElementById("fBusca").value = "";
      document.getElementById("btnToday").click();
    }

    async function loadData() {
      const seq = ++loadSeq;
      const hadData = allRows.length > 0;
      if (!hadData && !restoreSession()) {
        YardexDash.showStatus(statusEl, "Carregando dados…", false);
      }

      try {
        const json = await YardexDash.fetchWebhook(API_URL);
        if (seq !== loadSeq) return;
        let rows = ingestPayload(json);
        // Homolog/local: soma API real ao fixture para não perder o dia corrente.
        if (YardexDash.useHomologData()) {
          try {
            const liveRes = await fetch(`${API_URL}${API_URL.includes("?") ? "&" : "?"}_t=${Date.now()}`, {
              cache: "no-store",
              mode: "cors",
              headers: { "Cache-Control": "no-cache", Pragma: "no-cache" }
            });
            if (liveRes.ok) {
              const liveJson = await liveRes.json();
              rows = YardexDash.dedupeGestaoRows(rows.concat(ingestPayload(liveJson)));
            }
          } catch (_) { /* mantém fixture */ }
        }
        allRows = rows;
        saveSession();
        renderDashboard();
        YardexDash.showStatus(statusEl, `${allRows.length} pedido(s) carregado(s).`, false);
      } catch (err) {
        if (seq !== loadSeq) return;
        if (allRows.length) {
          YardexDash.showStatus(statusEl, `Atualização falhou — cache (${err.message})`, true);
          return;
        }
        if (restoreSession()) {
          YardexDash.showStatus(statusEl, `API indisponível — cache (${err.message})`, true);
          return;
        }
        YardexDash.showStatus(statusEl, `Erro: ${err.message}`, true);
      }
    }

    const btnToggleFilters = document.getElementById("btnToggleFilters");
    btnToggleFilters.addEventListener("click", () => {
      document.body.classList.toggle("show-filters");
      btnToggleFilters.classList.toggle("primary", document.body.classList.contains("show-filters"));
    });

    document.getElementById("btnClear").addEventListener("click", clearFilters);
    document.getElementById("fMarca").addEventListener("change", renderDashboard);
    document.getElementById("fCategoria").addEventListener("change", renderDashboard);
    document.getElementById("fBusca").addEventListener("input", () => {
      clearTimeout(window.__gpBuscaT);
      window.__gpBuscaT = setTimeout(renderDashboard, 200);
    });

    restoreSession();
    YardexDash.bindDateFilters({ onChange: renderDashboard, onReload: loadData });

    // Hora atual: sobe a máscara no refresh a cada minuto (ticks de 5 min até 50).
    if (APPLY_MASK) {
      setInterval(() => {
        renderDashboard();
      }, 60 * 1000);
    }
  </script>
</body>
</html>
