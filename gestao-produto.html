<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Produto</title>
  <link rel="stylesheet" href="yardex-dash.css?v=11" />
  <script src="yardex-version.js?v=2"></script>
  <script src="yardex-dash.js?v=44"></script>
</head>
<body class="dash-page gestao-pecas-page">
  <div class="page">
    <div class="dash-toolbar">
      <a class="back" href="menu.html">← Menu</a>
      <div class="dash-title">
        <h1>Gestão de Produto</h1>
        <p class="subtitle" id="periodLabel">Carregando período…</p>
      </div>
      <div class="filter-row">
        <label>Data inicial <input type="date" id="dateStart" /></label>
        <label>Data final <input type="date" id="dateEnd" /></label>
        <button type="button" class="primary" id="btnApply">Atualizar</button>
        <button type="button" id="btnToday">Hoje</button>
        <button type="button" id="btnReload">Recarregar</button>
      </div>
    </div>

    <div id="statusMsg" class="status" hidden></div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="label">Peças pedidas no período</div>
        <div class="value" id="kpiTotal">0</div>
      </div>
      <div class="kpi-card">
        <div class="label">Aparelhos no período</div>
        <div class="value" id="kpiProdutos">0</div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="label" id="monthPecasLabel">Peças pedidas no mês</div>
        <div class="value" id="kpiTotalMes">0</div>
      </div>
      <div class="kpi-card">
        <div class="label" id="monthAparelhosLabel">Aparelhos no mês</div>
        <div class="value" id="kpiProdutosMes">0</div>
      </div>
    </div>

    <div class="dash-main dash-main--table-only">
      <div class="panel">
        <h2>Peças por produto_requisitado_id</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>produto_requisitado_id</th>
                <th>Descrição</th>
                <th>Qtd</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="tableEmpty" class="empty" hidden>Nenhuma peça pedida no período.</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = YardexDash.API_REPARO;
    const ETAPAS_PERMITIDAS = YardexDash.ETAPAS_OPERACAO;
    const statusEl = document.getElementById("statusMsg");

    const SESSION_KEY = "yardex_gestao_rows_v2";
    const SESSION_TTL_MS = 3600000;

    let allRows = [];
    let loadSeq = 0;

    function ingestGestaoRows(payload) {
      const rawList = YardexDash.normalizeRows(payload);
      const out = [];
      for (let i = 0; i < rawList.length; i++) {
        const raw = rawList[i];
        if (!raw || typeof raw !== "object") continue;
        if (!YardexDash.passesGestaoRaw(raw, ETAPAS_PERMITIDAS)) continue;

        const produtoId = raw.produto_requisitado_id ?? raw.produto_id_requisitado;

        out.push({
          id: raw.id ?? null,
          data_pedido_sankhya: YardexDash.resolveGestaoDate(raw),
          produto_requisitado_id: String(produtoId).trim(),
          descricao: raw.peca_requisitada || raw.PECA_REQUISITADA || "—"
        });
      }
      return out;
    }

    function saveSessionRows(rows) {
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ at: Date.now(), rows }));
      } catch {
        /* payload grande demais — ignora */
      }
    }

    function restoreSessionRows() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (!parsed?.rows?.length || Date.now() - parsed.at > SESSION_TTL_MS) return false;
        allRows = parsed.rows;
        renderDashboard();
        return true;
      } catch {
        return false;
      }
    }

    function getMonthRange(refISO) {
      const [y, m] = refISO.split("-");
      const lastDay = new Date(Number(y), Number(m), 0).getDate();
      return {
        start: `${y}-${m}-01`,
        end: `${y}-${m}-${String(lastDay).padStart(2, "0")}`
      };
    }

    function monthLabel(refISO) {
      const [y, m] = refISO.split("-");
      const names = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
      return `${names[Number(m) - 1]}/${y}`;
    }

    function computeGestaoKpis(rows, start, end) {
      let pecas = 0;
      const ids = new Set();
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const local = YardexDash.toLocalDateStr(row.data_pedido_sankhya);
        if (local < start || local > end) continue;
        pecas++;
        if (row.id != null && String(row.id).trim() !== "") ids.add(String(row.id).trim());
      }
      return { pecas, aparelhos: ids.size };
    }

    function rowsForPeriod(rows, start, end) {
      const out = [];
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const local = YardexDash.toLocalDateStr(row.data_pedido_sankhya);
        if (local >= start && local <= end) out.push(row);
      }
      return out;
    }

    function renderTable(rows) {
      const tbody = document.getElementById("tableBody");
      const empty = document.getElementById("tableEmpty");
      const counts = new Map();
      const descMap = new Map();

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const id = row.produto_requisitado_id;
        counts.set(id, (counts.get(id) || 0) + 1);
        if (!descMap.has(id)) descMap.set(id, row.descricao);
      }

      const byProduto = [...counts.entries()].sort((a, b) => b[1] - a[1]);

      if (!byProduto.length) {
        tbody.innerHTML = "";
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      tbody.innerHTML = byProduto
        .map(([produtoId, qtd]) => `
          <tr>
            <td>${produtoId}</td>
            <td>${descMap.get(produtoId) || "—"}</td>
            <td style="font-weight:700;color:var(--bg)">${qtd}</td>
          </tr>
        `)
        .join("");
    }

    function renderDashboard() {
      const { start, end } = YardexDash.getDateRange();
      if (!start || !end) return;
      if (start > end) {
        YardexDash.showStatus(statusEl, "A data inicial não pode ser maior que a data final.", true);
        return;
      }

      const period = computeGestaoKpis(allRows, start, end);
      const month = getMonthRange(end);
      const mes = computeGestaoKpis(allRows, month.start, month.end);

      document.getElementById("kpiTotal").textContent = period.pecas;
      document.getElementById("kpiProdutos").textContent = period.aparelhos;
      document.getElementById("kpiTotalMes").textContent = mes.pecas;
      document.getElementById("kpiProdutosMes").textContent = mes.aparelhos;
      const monthText = monthLabel(end);
      document.getElementById("monthPecasLabel").textContent = `Peças pedidas no mês — ${monthText}`;
      document.getElementById("monthAparelhosLabel").textContent = `Aparelhos no mês — ${monthText}`;
      document.getElementById("periodLabel").textContent =
        `Período: ${YardexDash.formatPeriodBR(start, end)} · pedido Sankhya ou Iniciado_Reparo · operação reparo/gestao_pecas`;

      const tableRows = rowsForPeriod(allRows, start, end);
      if (typeof requestIdleCallback === "function") {
        requestIdleCallback(() => renderTable(tableRows), { timeout: 500 });
      } else {
        setTimeout(() => renderTable(tableRows), 0);
      }

      YardexDash.showStatus(
        statusEl,
        `${period.pecas} peça(s) · ${period.aparelhos} aparelho(s) no período · ${mes.pecas} peça(s) · ${mes.aparelhos} aparelho(s) no mês.`,
        false
      );
    }

    function clearKpis() {
      document.getElementById("kpiTotal").textContent = "0";
      document.getElementById("kpiProdutos").textContent = "0";
      document.getElementById("kpiTotalMes").textContent = "0";
      document.getElementById("kpiProdutosMes").textContent = "0";
      renderTable([]);
    }

    async function loadData() {
      const seq = ++loadSeq;
      const hadData = allRows.length > 0;

      if (!hadData && !restoreSessionRows()) {
        YardexDash.showStatus(statusEl, "Carregando dados…", false);
      } else {
        YardexDash.showStatus(statusEl, hadData ? "Atualizando dados…" : "Dados locais — atualizando…", false);
      }

      try {
        const json = await YardexDash.fetchWebhook(API_URL);
        if (seq !== loadSeq) return;

        allRows = ingestGestaoRows(json);
        saveSessionRows(allRows);
        renderDashboard();
        YardexDash.showStatus(statusEl, `${allRows.length} pedido(s) carregado(s).`, false);
      } catch (err) {
        if (seq !== loadSeq) return;

        if (allRows.length) {
          YardexDash.showStatus(statusEl, `Atualização falhou — exibindo últimos dados (${err.message})`, true);
          return;
        }
        if (restoreSessionRows()) {
          YardexDash.showStatus(statusEl, `API indisponível — exibindo cache local (${err.message})`, true);
          return;
        }
        YardexDash.showStatus(statusEl, `Erro: ${err.message}`, true);
        clearKpis();
      }
    }

    restoreSessionRows();
    const { reload } = YardexDash.bindDateFilters({ onChange: renderDashboard, onReload: loadData });
  </script>
</body>
</html>
