<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="skyline-auth.js?v=4"></script>
  <title>Estoque — Skyline Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="skyline-version.js?v=2"></script>
  <script src="skyline-dash.js?v=73"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-2: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #f7f9fc;
      --line: rgba(15, 40, 70, 0.12);
      --text: #15202b;
      --muted: #5b6b7f;
      --cyan: #0b8ec4;
      --soft: rgba(15, 40, 70, 0.04);
      --radius: 14px;
      --shadow: 0 8px 28px rgba(15, 40, 70, 0.08);
      --font-display: "Orbitron", sans-serif;
      --font-body: "Exo 2", sans-serif;
      --purple: #4b2e83;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(75, 46, 131, 0.08), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(11, 142, 196, 0.05), transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: var(--font-body);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-top {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 18px rgba(15, 40, 70, 0.04);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-block img {
      height: 34px;
      width: auto;
      display: block;
    }

    .brand-text {
      display: grid;
      gap: 2px;
    }

    .brand-text strong {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--purple);
    }

    .brand-text span {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .search-box {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      min-width: 240px;
    }

    .search-box input {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 0.95rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: rgba(75, 46, 131, 0.45);
      box-shadow: 0 0 0 3px rgba(75, 46, 131, 0.12);
    }

    .btn {
      height: 40px;
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #4b2e83, #7c5cbf);
      color: #ffffff;
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .main {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 18px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filters-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: grid;
      gap: 14px;
    }

    .filters-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-field {
      display: grid;
      gap: 4px;
      min-width: 160px;
    }

    .filter-field > span,
    .filter-field > label {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .filter-field select {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      font-size: 0.9rem;
      min-width: 180px;
    }

    .check-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .check-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      cursor: pointer;
      user-select: none;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text);
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .check-chip:hover {
      border-color: rgba(75, 46, 131, 0.35);
    }

    .check-chip:has(input:checked) {
      background: rgba(75, 46, 131, 0.1);
      border-color: rgba(75, 46, 131, 0.45);
      color: var(--purple);
    }

    .check-chip input {
      width: 15px;
      height: 15px;
      accent-color: var(--purple);
      margin: 0;
      cursor: pointer;
    }

    .check-empty {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 6px 0;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
    }

    .stat .lab {
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat .val {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.03em;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sheet-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 14px;
    }

    .sheet-brand img {
      height: 36px;
      width: auto;
      display: block;
    }

    .table-wrap {
      overflow: auto;
      flex: 1;
      min-height: 360px;
      max-height: calc(100vh - 320px);
      border: 1px solid #d9d2e8;
      border-radius: 8px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    th, td {
      text-align: center;
      padding: 10px 12px;
      border: 1px solid #d9d2e8;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #4b2e83;
      color: #ffffff;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 800;
      white-space: nowrap;
    }

    td {
      background: #ffffff;
      color: #2b2438;
    }

    td.sku {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-align: left;
    }

    td.desc {
      text-align: left;
      font-weight: 600;
    }

    td.money {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
      color: #4b2e83;
    }

    td.saldo {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      white-space: nowrap;
    }

    td.grade-a {
      background: #d9f2d0;
      color: #1f7a1f;
      font-weight: 800;
    }

    td.grade-b {
      background: #d6e8fb;
      color: #1f4f9a;
      font-weight: 800;
    }

    td.grade-bom {
      background: #ebe4f7;
      color: #5b3d8f;
      font-weight: 800;
    }

    td.grade-outlet {
      background: #fde7c7;
      color: #c45a12;
      font-weight: 800;
    }

    tr:hover td:not([class*="grade-"]) { background: #f7f3fc; }

    .empty, .loading, .error {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      border: 0 !important;
    }

    .error { color: #e03131; }

    .status {
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    .status.err { color: #e03131; }

    @media (max-width: 980px) {
      .hero-stats { grid-template-columns: 1fr; }
      .table-wrap { max-height: none; }
    }
  </style>
</head>
<body>
  <main class="main">
    <div class="top-row">
      <a class="btn ghost" href="menu.html" style="display:inline-flex;align-items:center;text-decoration:none">← Menu</a>
      <div class="search-box" style="flex:1;min-width:240px">
        <input
          id="filterSearch"
          type="search"
          placeholder="Buscar SKU, descrição, marca ou qualidade…"
          autocomplete="off"
        />
        <button class="btn" type="button" id="btnReload">Atualizar</button>
        <button class="btn ghost" type="button" id="btnExcel" title="Baixar planilha (.xlsx)">
          Excel
        </button>
      </div>
      <div class="status" id="metaStamp" style="margin:0">—</div>
    </div>

    <div class="status" id="statusMsg">Carregando…</div>

    <section class="hero-stats">
      <div class="stat">
        <div class="lab">Itens listados</div>
        <div class="val" id="kpiTotal">0</div>
      </div>
      <div class="stat">
        <div class="lab">Saldo total</div>
        <div class="val" id="kpiSaldo">0</div>
      </div>
      <div class="stat">
        <div class="lab">Exibindo (filtro)</div>
        <div class="val" id="kpiVisible">0</div>
      </div>
    </section>

    <section class="filters-panel" aria-label="Filtros">
      <div class="filter-field">
        <span>Marca</span>
        <div class="check-group" id="filterMarca"></div>
      </div>
      <div class="filter-field">
        <span>Qualidade</span>
        <div class="check-group" id="filterQualidade"></div>
      </div>
      <div class="filters-row">
        <div class="filter-field">
          <label for="filterSort">Ordenar por</label>
          <select id="filterSort">
            <option value="marca">Marca · A–Z</option>
            <option value="descricao">Descrição · A–Z</option>
            <option value="sku">SKU · A–Z</option>
            <option value="qualidade">Qualidade · A–Z</option>
            <option value="saldo_desc">Saldo · maior</option>
            <option value="saldo_asc">Saldo · menor</option>
            <option value="valor_desc">Valor · maior</option>
            <option value="valor_asc">Valor · menor</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Descrição</th>
              <th>Marca</th>
              <th>Qualidade</th>
              <th>Saldo</th>
              <th>Valor do produto</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6" class="loading">Carregando lista…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_URL = SkylineDash.API_LISTA_PRECOS;
    let allRows = [];
    let viewRows = [];

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function shortDescricao(produto) {
      const s = String(produto || "").trim();
      if (!s) return "—";
      const idx = s.indexOf("-");
      if (idx < 0) return s;
      const left = s.slice(0, idx).trim();
      return left || s;
    }

    function parseMoney(v) {
      if (v == null || v === "") return null;
      if (typeof v === "number" && Number.isFinite(v)) return v;
      let s = String(v).trim().replace(/R\$\s?/gi, "").replace(/\s/g, "");
      if (!s) return null;
      if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
      else if (s.includes(",")) s = s.replace(",", ".");
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function formatMoney(v) {
      if (v == null || !Number.isFinite(v)) return "—";
      return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function parseSaldo(v) {
      if (v == null || v === "") return null;
      if (typeof v === "number" && Number.isFinite(v)) return v;
      const n = Number(String(v).trim().replace(",", "."));
      return Number.isFinite(n) ? n : null;
    }

    function mapRow(raw) {
      const valor = parseMoney(raw["Preco Tabela 1"] ?? raw.preco_tabela_1 ?? raw.PrecoTabela1);
      const saldo = parseSaldo(
        raw.Saldo_Principal ?? raw.saldo_principal ?? raw.Saldo ?? raw.saldo ?? raw.ESTOQUE ?? raw.estoque
      );
      return {
        sku: String(raw.SKU ?? raw.sku ?? "").trim(),
        descricao: shortDescricao(raw.Produto ?? raw.produto ?? raw.descricao),
        produtoFull: String(raw.Produto ?? raw.produto ?? "").trim(),
        marca: String(raw.Marca ?? raw.marca ?? "").trim() || "—",
        qualidade: String(raw.Qualidade ?? raw.qualidade ?? "").trim() || "—",
        saldo,
        valor
      };
    }

    function gradeClass(qualidade) {
      const k = String(qualidade || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      if (!k || k === "—") return "";
      if (k.includes("outlet")) return "grade-outlet";
      if (k.includes("excelente") || k.includes("grade a") || k.includes("premium a")) return "grade-a";
      if (k.includes("muito bom") || k.includes("grade b") || k.includes("premium b")) return "grade-b";
      if (k === "bom" || k.includes("grade c") || /(^|\s)bom(\s|$)/.test(k)) return "grade-bom";
      return "";
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg || "";
      el.classList.toggle("err", Boolean(isError));
    }

    function fillCheckGroup(id, values) {
      const el = document.getElementById(id);
      const prev = new Set(
        [...el.querySelectorAll('input[type="checkbox"]:checked')].map((i) => i.value)
      );
      const sorted = [...new Set(values.filter((v) => v && v !== "—"))]
        .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"));
      if (!sorted.length) {
        el.innerHTML = `<span class="check-empty">Sem opções</span>`;
        return;
      }
      el.innerHTML = sorted.map((v) => {
        const checked = prev.has(v) ? " checked" : "";
        return `<label class="check-chip">
          <input type="checkbox" value="${escapeHtml(v)}"${checked} />
          <span>${escapeHtml(v)}</span>
        </label>`;
      }).join("");
      el.querySelectorAll('input[type="checkbox"]').forEach((input) => {
        input.addEventListener("change", applyFilter);
      });
    }

    function selectedValues(id) {
      return [...document.querySelectorAll(`#${id} input[type="checkbox"]:checked`)]
        .map((i) => i.value);
    }

    function fillFilterOptions() {
      fillCheckGroup("filterMarca", allRows.map((r) => r.marca));
      fillCheckGroup("filterQualidade", allRows.map((r) => r.qualidade));
    }

    function cmpText(a, b) {
      return String(a || "").localeCompare(String(b || ""), "pt-BR", { sensitivity: "base", numeric: true });
    }

    function cmpNum(a, b, dir) {
      const na = Number.isFinite(a) ? a : (dir > 0 ? Infinity : -Infinity);
      const nb = Number.isFinite(b) ? b : (dir > 0 ? Infinity : -Infinity);
      return (na - nb) * dir;
    }

    function sortRows(rows) {
      const mode = document.getElementById("filterSort").value || "marca";
      const list = [...rows];
      list.sort((a, b) => {
        switch (mode) {
          case "descricao":
            return cmpText(a.descricao, b.descricao) || cmpText(a.sku, b.sku);
          case "sku":
            return cmpText(a.sku, b.sku);
          case "qualidade":
            return cmpText(a.qualidade, b.qualidade) || cmpText(a.descricao, b.descricao);
          case "saldo_desc":
            return cmpNum(a.saldo, b.saldo, -1) || cmpText(a.descricao, b.descricao);
          case "saldo_asc":
            return cmpNum(a.saldo, b.saldo, 1) || cmpText(a.descricao, b.descricao);
          case "valor_desc":
            return cmpNum(a.valor, b.valor, -1) || cmpText(a.descricao, b.descricao);
          case "valor_asc":
            return cmpNum(a.valor, b.valor, 1) || cmpText(a.descricao, b.descricao);
          case "marca":
          default:
            return cmpText(a.marca, b.marca) || cmpText(a.descricao, b.descricao) || cmpText(a.sku, b.sku);
        }
      });
      return list;
    }

    function applyFilter() {
      const q = String(document.getElementById("filterSearch").value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      const marcas = selectedValues("filterMarca");
      const qualidades = selectedValues("filterQualidade");

      const filtered = allRows.filter((r) => {
        if (marcas.length && !marcas.includes(r.marca)) return false;
        if (qualidades.length && !qualidades.includes(r.qualidade)) return false;
        if (!q) return true;
        const blob = `${r.sku} ${r.descricao} ${r.marca} ${r.qualidade} ${r.produtoFull}`
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
        return blob.includes(q);
      });
      viewRows = sortRows(filtered);
      renderTable();
    }

    function renderKpis() {
      document.getElementById("kpiTotal").textContent = String(allRows.length);
      document.getElementById("kpiVisible").textContent = String(viewRows.length);
      const saldoSum = viewRows.reduce((sum, r) => sum + (Number.isFinite(r.saldo) ? r.saldo : 0), 0);
      document.getElementById("kpiSaldo").textContent = String(saldoSum);
    }

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      renderKpis();
      if (!viewRows.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty">${
          allRows.length ? "Nenhum item no filtro." : "Sem itens no estoque."
        }</td></tr>`;
        return;
      }
      tbody.innerHTML = viewRows.map((r) => {
        const gClass = gradeClass(r.qualidade);
        const saldoTxt = r.saldo == null ? "—" : String(r.saldo);
        return `
        <tr>
          <td class="sku">${escapeHtml(r.sku || "—")}</td>
          <td class="desc">${escapeHtml(r.descricao)}</td>
          <td>${escapeHtml(r.marca)}</td>
          <td class="${gClass}">${escapeHtml(r.qualidade)}</td>
          <td class="saldo">${escapeHtml(saldoTxt)}</td>
          <td class="money">${escapeHtml(formatMoney(r.valor))}</td>
        </tr>`;
      }).join("");
    }

    function xmlEscape(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function excelCellText(value, styleId) {
      const style = styleId ? ` ss:StyleID="${styleId}"` : "";
      return `<Cell${style}><Data ss:Type="String">${xmlEscape(value)}</Data></Cell>`;
    }

    function excelCellNumber(value, styleId) {
      if (value == null || !Number.isFinite(value)) return excelCellText("", styleId);
      const style = styleId ? ` ss:StyleID="${styleId}"` : "";
      return `<Cell${style}><Data ss:Type="Number">${value}</Data></Cell>`;
    }

    function gradeExcelStyle(qualidade) {
      const cls = gradeClass(qualidade);
      if (cls === "grade-a") return "GradeA";
      if (cls === "grade-b") return "GradeB";
      if (cls === "grade-bom") return "GradeBom";
      if (cls === "grade-outlet") return "GradeOutlet";
      return "Body";
    }

    function downloadExcel() {
      const rows = viewRows.length ? viewRows : allRows;
      if (!rows.length) {
        alert("Nenhum item para exportar.");
        return;
      }
      const header = ["SKU","Descrição","Marca","Qualidade","Saldo","Valor do produto"]
        .map((h) => excelCellText(h, "Header")).join("");
      const body = rows.map((r) => `<Row>${[
        excelCellText(r.sku, "BodyLeft"),
        excelCellText(r.descricao, "BodyLeft"),
        excelCellText(r.marca, "Body"),
        excelCellText(r.qualidade, gradeExcelStyle(r.qualidade)),
        excelCellNumber(r.saldo, "Body"),
        excelCellNumber(r.valor, "Money")
      ].join("")}</Row>`).join("");
      const stamp = new Date().toISOString().slice(0, 10);
      const filename = `estoque-${stamp}.xls`;
      const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>
  <Style ss:ID="Header"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#4B2E83" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>

    async function loadData() {
      setStatus("Carregando estoque…");
      document.getElementById("btnReload").disabled = true;
      document.getElementById("btnExcel").disabled = true;
      try {
        const json = await SkylineDash.fetchWebhook(API_URL);
        const rawRows = SkylineDash.normalizeRows(json);
        allRows = rawRows
          .map(mapRow)
          .filter((r) => r.sku || r.descricao !== "—");
        document.getElementById("metaStamp").textContent =
          `${allRows.length} item(ns) · atualizado ${new Date().toLocaleString("pt-BR")}`;
        fillFilterOptions();
        applyFilter();
        setStatus(`${allRows.length} item(ns) carregado(s).`);
        SkylineDash.markRefresh?.();
      } catch (err) {
        allRows = [];
        viewRows = [];
        fillFilterOptions();
        renderTable();
        setStatus(`Erro: ${err.message}`, true);
        document.getElementById("tableBody").innerHTML =
          `<tr><td colspan="6" class="error">Falha ao carregar: ${escapeHtml(err.message)}</td></tr>`;
      } finally {
        document.getElementById("btnReload").disabled = false;
        document.getElementById("btnExcel").disabled = false;
      }
    }

    document.getElementById("btnReload").addEventListener("click", loadData);
    document.getElementById("btnExcel").addEventListener("click", downloadExcel);
    document.getElementById("filterSearch").addEventListener("input", applyFilter);
    document.getElementById("filterSort").addEventListener("change", applyFilter);

    if (typeof SkylineVersion !== "undefined") SkylineVersion.start(60000);
    loadData();
  </script>
