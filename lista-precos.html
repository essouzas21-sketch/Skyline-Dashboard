<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Preços — Skyline Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="yardex-version.js?v=2"></script>
  <script src="yardex-dash.js?v=68"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-2: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #f7f9fc;
      --line: rgba(15, 40, 70, 0.12);
      --text: #15202b;
      --muted: #5b6b7f;
      --cyan: #0b8ec4;
      --cyan-dim: rgba(11, 142, 196, 0.12);
      --soft: rgba(15, 40, 70, 0.04);
      --radius: 14px;
      --shadow: 0 8px 28px rgba(15, 40, 70, 0.08);
      --font-display: "Orbitron", sans-serif;
      --font-body: "Exo 2", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(11, 142, 196, 0.06), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(112, 72, 232, 0.05), transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: var(--font-body);
    }

    body {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .side {
      border-right: 1px solid var(--line);
      background: #ffffff;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px 12px;
      border-bottom: 1px solid var(--line);
    }

    .brand-logo {
      display: block;
      height: 34px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: left center;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav a, .nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-decoration: none;
      text-align: left;
      font: inherit;
      font-size: 0.84rem;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .nav a:hover, .nav button:hover { color: var(--text); background: var(--soft); }
    .nav a.active, .nav button.active {
      color: var(--cyan);
      background: var(--cyan-dim);
      box-shadow: inset 0 0 0 1px rgba(11, 142, 196, 0.25);
    }

    .side-foot {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .main {
      min-width: 0;
      padding: 18px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .filters-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-field {
      display: grid;
      gap: 4px;
      min-width: 160px;
    }

    .filter-field label {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .filter-field select {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      font-size: 0.9rem;
      min-width: 180px;
    }

    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .back:hover { color: var(--text); border-color: rgba(11,142,196,0.4); }

    .search-box {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      min-width: 280px;
    }

    .search-box input {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 0.95rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: rgba(11, 142, 196, 0.55);
      box-shadow: 0 0 0 3px rgba(11, 142, 196, 0.12);
    }

    .btn {
      height: 40px;
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #0b8ec4, #3ec6ff);
      color: #ffffff;
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .meta-right {
      margin-left: auto;
      text-align: right;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .meta-right strong {
      display: block;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
    }

    .stat .lab {
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat .val {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.03em;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .card h2 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .table-wrap {
      overflow: auto;
      flex: 1;
      min-height: 360px;
      max-height: calc(100vh - 280px);
      border: 1px solid #d9d2e8;
      border-radius: 8px;
      background: #fff;
    }

    .sheet-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px 14px;
    }

    .sheet-brand img {
      height: 36px;
      width: auto;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    th, td {
      text-align: center;
      padding: 10px 12px;
      border: 1px solid #d9d2e8;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #4b2e83;
      color: #ffffff;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 800;
      white-space: nowrap;
    }

    td {
      background: #ffffff;
      color: #2b2438;
    }

    td.sku {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-align: left;
    }

    td.desc {
      text-align: left;
      font-weight: 600;
    }

    td.money {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
      color: #4b2e83;
    }

    td.qtd {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    td.grade-a {
      background: #d9f2d0;
      color: #1f7a1f;
      font-weight: 800;
    }

    td.grade-b {
      background: #d6e8fb;
      color: #1f4f9a;
      font-weight: 800;
    }

    td.grade-outlet {
      background: #fde7c7;
      color: #c45a12;
      font-weight: 800;
    }

    tr:hover td:not([class*="grade-"]) { background: #f7f3fc; }

    .empty, .loading, .error {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      border: 0 !important;
    }

    .error { color: #e03131; }

    .status {
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    .status.err { color: #e03131; }

    @media (max-width: 980px) {
      body { grid-template-columns: 1fr; }
      .side { display: none; }
      .hero-stats { grid-template-columns: 1fr; }
      .table-wrap { max-height: none; }
    }
  </style>
</head>
<body>
  <aside class="side">
    <div class="brand">
      <img
        class="brand-logo"
        src="assets/skyline-logo-wordmark.jpg"
        alt="Skyline mobile"
        width="108"
        height="34"
      />
    </div>

    <nav class="nav">
      <a class="active" href="lista-precos.html">Lista de Preços</a>
      <a href="nr-timeline.html">NR Timeline</a>
      <a href="consolidado.html">Consolidado</a>
      <a href="menu.html">Menu</a>
    </nav>

    <div class="side-foot">
      Fonte: webhook <code>listaprecos</code><br />
      Descrição até o hífen do produto.
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <a class="back" href="menu.html">← Menu</a>
      <div class="search-box">
        <input
          id="filterSearch"
          type="search"
          placeholder="Buscar SKU, descrição, marca ou qualidade…"
          autocomplete="off"
        />
        <button class="btn" type="button" id="btnReload">Atualizar</button>
        <button class="btn ghost" type="button" id="btnExcel" title="Exportar planilha Excel">
          Excel
        </button>
      </div>
      <div class="meta-right">
        <strong>LISTA DE PREÇOS</strong>
        <span id="metaStamp">—</span>
      </div>
    </div>

    <div class="filters-row">
      <div class="filter-field">
        <label for="filterMarca">Marca</label>
        <select id="filterMarca">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filterQualidade">Qualidade</label>
        <select id="filterQualidade">
          <option value="">Todas</option>
        </select>
      </div>
    </div>

    <div class="status" id="statusMsg">Carregando…</div>

    <section class="hero-stats">
      <div class="stat">
        <div class="lab">Itens listados</div>
        <div class="val" id="kpiTotal">0</div>
      </div>
      <div class="stat">
        <div class="lab">Marcas</div>
        <div class="val" id="kpiMarcas">0</div>
      </div>
      <div class="stat">
        <div class="lab">Exibindo (filtro)</div>
        <div class="val" id="kpiVisible">0</div>
      </div>
    </section>

    <section class="card">
      <div class="sheet-brand">
        <img src="assets/skyline-logo-wordmark.jpg" alt="Skyline mobile" width="120" height="38" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Descrição</th>
              <th>Marca</th>
              <th>Qualidade</th>
              <th>Valor do produto</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="loading">Carregando lista…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_URL = YardexDash.API_LISTA_PRECOS;
    let allRows = [];
    let viewRows = [];

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function shortDescricao(produto) {
      const s = String(produto || "").trim();
      if (!s) return "—";
      const idx = s.indexOf("-");
      if (idx < 0) return s;
      const left = s.slice(0, idx).trim();
      return left || s;
    }

    function parseMoney(v) {
      if (v == null || v === "") return null;
      if (typeof v === "number" && Number.isFinite(v)) return v;
      let s = String(v).trim().replace(/R\$\s?/gi, "").replace(/\s/g, "");
      if (!s) return null;
      if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
      else if (s.includes(",")) s = s.replace(",", ".");
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function formatMoney(v) {
      if (v == null || !Number.isFinite(v)) return "—";
      return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function mapRow(raw) {
      const valor = parseMoney(raw["Preco Tabela 1"] ?? raw.preco_tabela_1 ?? raw.PrecoTabela1);
      return {
        sku: String(raw.SKU ?? raw.sku ?? "").trim(),
        descricao: shortDescricao(raw.Produto ?? raw.produto ?? raw.descricao),
        produtoFull: String(raw.Produto ?? raw.produto ?? "").trim(),
        marca: String(raw.Marca ?? raw.marca ?? "").trim() || "—",
        qualidade: String(raw.Qualidade ?? raw.qualidade ?? "").trim() || "—",
        valor
      };
    }

    function gradeClass(qualidade) {
      const k = String(qualidade || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      if (!k || k === "—") return "";
      if (k.includes("outlet")) return "grade-outlet";
      if (k.includes("excelente") || /(^|\s)a(\s|$)/.test(k) || k.includes("premium a") || k.includes("grade a")) {
        return "grade-a";
      }
      if (k.includes("muito bom") || /(^|\s)b(\s|$)/.test(k) || k.includes("premium b") || k.includes("grade b")) {
        return "grade-b";
      }
      return "";
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg || "";
      el.classList.toggle("err", Boolean(isError));
    }

    function fillSelect(id, values) {
      const el = document.getElementById(id);
      const cur = el.value;
      const sorted = [...new Set(values.filter((v) => v && v !== "—"))]
        .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"));
      el.innerHTML = `<option value="">Todas</option>` + sorted.map((v) =>
        `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`
      ).join("");
      if (cur && sorted.includes(cur)) el.value = cur;
    }

    function fillFilterOptions() {
      fillSelect("filterMarca", allRows.map((r) => r.marca));
      fillSelect("filterQualidade", allRows.map((r) => r.qualidade));
    }

    function applyFilter() {
      const q = String(document.getElementById("filterSearch").value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      const marca = document.getElementById("filterMarca").value;
      const qualidade = document.getElementById("filterQualidade").value;

      viewRows = allRows.filter((r) => {
        if (marca && r.marca !== marca) return false;
        if (qualidade && r.qualidade !== qualidade) return false;
        if (!q) return true;
        const blob = `${r.sku} ${r.descricao} ${r.marca} ${r.qualidade} ${r.produtoFull}`
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
        return blob.includes(q);
      });
      renderTable();
    }

    function renderKpis() {
      document.getElementById("kpiTotal").textContent = String(allRows.length);
      document.getElementById("kpiVisible").textContent = String(viewRows.length);
      const marcas = new Set(allRows.map((r) => r.marca).filter((m) => m && m !== "—"));
      document.getElementById("kpiMarcas").textContent = String(marcas.size);
    }

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      renderKpis();
      if (!viewRows.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">${
          allRows.length ? "Nenhum item no filtro." : "Sem itens na lista de preços."
        }</td></tr>`;
        return;
      }
      tbody.innerHTML = viewRows.map((r) => {
        const gClass = gradeClass(r.qualidade);
        return `
        <tr>
          <td class="sku">${escapeHtml(r.sku || "—")}</td>
          <td class="desc">${escapeHtml(r.descricao)}</td>
          <td>${escapeHtml(r.marca)}</td>
          <td class="${gClass}">${escapeHtml(r.qualidade)}</td>
          <td class="money">${escapeHtml(formatMoney(r.valor))}</td>
        </tr>`;
      }).join("");
    }

    function xmlEscape(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const LOGO_JPG = "assets/skyline-logo-wordmark.jpg";
    let logoDataUri = "";

    async function ensureLogoDataUri() {
      if (logoDataUri) return logoDataUri;
      const url = new URL(LOGO_JPG, window.location.href).href;
      const res = await fetch(url, { cache: "force-cache" });
      if (!res.ok) throw new Error(`Logo HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      logoDataUri = `data:image/jpeg;base64,${btoa(binary)}`;
      return logoDataUri;
    }

    function gradeHtmlClass(qualidade) {
      const cls = gradeClass(qualidade);
      if (cls === "grade-a") return "grade-a";
      if (cls === "grade-b") return "grade-b";
      if (cls === "grade-outlet") return "grade-outlet";
      return "";
    }

    async function downloadExcel() {
      const rows = viewRows.length ? viewRows : allRows;
      if (!rows.length) {
        alert("Nenhum item para exportar.");
        return;
      }

      let logoSrc = "";
      try {
        logoSrc = await ensureLogoDataUri();
      } catch (err) {
        console.warn("Logo no Excel:", err);
        logoSrc = new URL(LOGO_JPG, window.location.href).href;
      }

      const body = rows.map((r) => {
        const g = gradeHtmlClass(r.qualidade);
        const valor = r.valor == null || !Number.isFinite(r.valor)
          ? ""
          : Number(r.valor).toFixed(2);
        return `<tr>
          <td class="left">${escapeHtml(r.sku)}</td>
          <td class="left">${escapeHtml(r.descricao)}</td>
          <td>${escapeHtml(r.marca)}</td>
          <td class="${g}">${escapeHtml(r.qualidade)}</td>
          <td class="money">${escapeHtml(valor)}</td>
        </tr>`;
      }).join("");

      const stamp = new Date().toISOString().slice(0, 10);
      const filename = `lista-precos-${stamp}.xls`;

      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8" />
<!--[if gte mso 9]><xml>
 <x:ExcelWorkbook>
  <x:ExcelWorksheets>
   <x:ExcelWorksheet>
    <x:Name>Lista de Precos</x:Name>
    <x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
   </x:ExcelWorksheet>
  </x:ExcelWorksheets>
 </x:ExcelWorkbook>
</xml><![endif]-->
<style>
  table { border-collapse: collapse; font-family: Calibri, Arial, sans-serif; font-size: 11pt; }
  td, th { border: 1px solid #D9D2E8; padding: 6px 8px; vertical-align: middle; text-align: center; }
  th { background: #4B2E83; color: #FFFFFF; font-weight: 800; text-transform: uppercase; }
  td.left { text-align: left; }
  td.money { font-weight: 700; color: #4B2E83; mso-number-format:'R$ '#,##0.00'; }
  td.grade-a { background: #D9F2D0; color: #1F7A1F; font-weight: 800; }
  td.grade-b { background: #D6E8FB; color: #1F4F9A; font-weight: 800; }
  td.grade-outlet { background: #FDE7C7; color: #C45A12; font-weight: 800; }
  .logo-row td { border: none; text-align: left; padding: 8px 0 12px; }
  .bar-row td { border: none; background: #4B2E83; height: 8px; font-size: 1px; }
</style>
</head>
<body>
<table>
  <tr class="logo-row">
    <td colspan="5">
      <img src="${logoSrc}" width="171" height="54" alt="Skyline mobile" />
    </td>
  </tr>
  <tr class="bar-row"><td colspan="5">&nbsp;</td></tr>
  <tr>
    <th>SKU</th>
    <th>Descrição</th>
    <th>Marca</th>
    <th>Qualidade</th>
    <th>Valor do produto</th>
  </tr>
  ${body}
</table>
</body>
</html>`;

      const blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30_000);
    }

    async function loadData() {
      setStatus("Carregando lista de preços…");
      document.getElementById("btnReload").disabled = true;
      document.getElementById("btnExcel").disabled = true;
      try {
        const json = await YardexDash.fetchWebhook(API_URL);
        const rawRows = YardexDash.normalizeRows(json);
        allRows = rawRows
          .map(mapRow)
          .filter((r) => r.sku || r.descricao !== "—")
          .sort((a, b) =>
            String(a.marca).localeCompare(String(b.marca), "pt-BR") ||
            String(a.descricao).localeCompare(String(b.descricao), "pt-BR") ||
            String(a.sku).localeCompare(String(b.sku), "pt-BR")
          );
        document.getElementById("metaStamp").textContent =
          `${allRows.length} item(ns) · atualizado ${new Date().toLocaleString("pt-BR")}`;
        fillFilterOptions();
        applyFilter();
        setStatus(`${allRows.length} item(ns) carregado(s).`);
        YardexDash.markRefresh?.();
      } catch (err) {
        allRows = [];
        viewRows = [];
        fillFilterOptions();
        renderTable();
        setStatus(`Erro: ${err.message}`, true);
        document.getElementById("tableBody").innerHTML =
          `<tr><td colspan="5" class="error">Falha ao carregar: ${escapeHtml(err.message)}</td></tr>`;
      } finally {
        document.getElementById("btnReload").disabled = false;
        document.getElementById("btnExcel").disabled = false;
      }
    }

    document.getElementById("btnReload").addEventListener("click", loadData);
    document.getElementById("btnExcel").addEventListener("click", () => {
      downloadExcel().catch((err) => {
        console.error(err);
        alert(`Falha ao exportar Excel: ${err.message || err}`);
      });
    });
    document.getElementById("filterSearch").addEventListener("input", applyFilter);
    document.getElementById("filterMarca").addEventListener("change", applyFilter);
    document.getElementById("filterQualidade").addEventListener("change", applyFilter);
    ensureLogoDataUri().catch(() => {});
    loadData();
  </script>
</body>
</html>
