<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CQE</title>
  <link rel="stylesheet" href="yardex-dash.css" />
  <script src="yardex-version.js"></script>
  <script src="yardex-dash.js?v=26"></script>
  <style>
    .kpi-card.aprovado .value { color: #15803d; }
    .kpi-card.reprovado .value { color: #dc2626; }
    .kpi-card.total .value { color: var(--bg); }
  </style>
</head>
<body class="dash-page">
  <div class="page">
    <div class="dash-toolbar">
      <a class="back" href="menu.html">← Menu</a>
      <div class="dash-title">
        <h1>CQE — Controle de Qualidade</h1>
        <p class="subtitle" id="periodLabel">Carregando período…</p>
      </div>
      <div class="filter-row">
        <label>Data inicial <input type="date" id="dateStart" /></label>
        <label>Data final <input type="date" id="dateEnd" /></label>
        <button type="button" class="primary" id="btnApply">Atualizar</button>
        <button type="button" id="btnToday">Hoje</button>
        <button type="button" id="btnReload">Recarregar</button>
      </div>
    </div>

    <div id="statusMsg" class="status" hidden></div>

    <div class="kpi-row">
      <div class="kpi-card aprovado">
        <div class="label">Aprovados</div>
        <div class="value" id="kpiAprovado">0</div>
      </div>
      <div class="kpi-card reprovado">
        <div class="label">Reprovados</div>
        <div class="value" id="kpiReprovado">0</div>
      </div>
      <div class="kpi-card total">
        <div class="label">Total</div>
        <div class="value" id="kpiTotal">0</div>
      </div>
    </div>

    <div class="dash-main dash-main--table-only">
      <div class="panel">
        <h2>Qualidade por colaborador</h2>
        <div class="split-panel">
          <div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Usuário qualidade</th>
                    <th>Aprovados</th>
                    <th>Reprovados</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
            <div id="tableEmpty" class="empty" hidden>Nenhuma inspeção no período.</div>
          </div>
          <div>
            <h3>Top 3 motivos de reprovação</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Motivo</th>
                    <th>Qtd</th>
                  </tr>
                </thead>
                <tbody id="motivosBody"></tbody>
              </table>
            </div>
            <div id="motivosEmpty" class="empty" hidden>Nenhuma reprovação no período.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = YardexDash.API_REPARO;
    const DATE_FIELD = "data_pedido_sankhya";
    const statusEl = document.getElementById("statusMsg");

    let allRows = [];

    function normalizeDecisao(decisao) {
      const v = String(decisao || "").trim().toLowerCase();
      if (v.includes("reprov")) return "reprovado";
      if (v.includes("aprov")) return "aprovado";
      return null;
    }

    function mapRow(raw) {
      const decisao = normalizeDecisao(raw.decisao);
      if (!decisao) return null;
      return {
        id: raw.id ?? null,
        data_pedido_sankhya: YardexDash.resolveCqeDate(raw, decisao),
        usuario: YardexDash.normalizeUserName(raw["Usuario qualidade"] || "—"),
        decisao,
        motivo: String(raw.motivo_reprovacao || "").trim() || "Sem motivo informado"
      };
    }

    function renderMotivosTable(topMotivos) {
      const tbody = document.getElementById("motivosBody");
      const empty = document.getElementById("motivosEmpty");
      if (!topMotivos.length) {
        tbody.innerHTML = "";
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      tbody.innerHTML = topMotivos.map(([motivo, qtd]) => `
        <tr>
          <td>${motivo}</td>
          <td style="font-weight:700;color:var(--bg)">${qtd}</td>
        </tr>
      `).join("");
    }

    function renderDashboard() {
      const { start, end } = YardexDash.getDateRange();
      if (!start || !end) return;
      if (start > end) {
        YardexDash.showStatus(statusEl, "A data inicial não pode ser maior que a data final.", true);
        return;
      }

      const inPeriod = YardexDash.filterByDateField(allRows, start, end, DATE_FIELD);
      const filtered = YardexDash.processCqeRows(inPeriod);
      const totals = { aprovado: 0, reprovado: 0, total: 0 };
      const byUser = new Map();

      filtered.forEach((row) => {
        totals[row.decisao]++;
        totals.total++;

        if (!byUser.has(row.usuario)) {
          byUser.set(row.usuario, { usuario: row.usuario, aprovado: 0, reprovado: 0, total: 0 });
        }
        const u = byUser.get(row.usuario);
        u[row.decisao]++;
        u.total++;
      });

      const reprovados = filtered.filter((r) => r.decisao === "reprovado");
      const topMotivos = YardexDash.aggregateCount(reprovados, (r) => r.motivo).slice(0, 3);

      document.getElementById("kpiAprovado").textContent = totals.aprovado;
      document.getElementById("kpiReprovado").textContent = totals.reprovado;
      document.getElementById("kpiTotal").textContent = totals.total;
      document.getElementById("periodLabel").textContent =
        `Período: ${YardexDash.formatPeriodBR(start, end)} · aprovado: Sankhya · reprovado: Fim do Reparo · 1x id/dia · sem motivo teste`;

      const tbody = document.getElementById("tableBody");
      const empty = document.getElementById("tableEmpty");
      const list = [...byUser.values()].sort((a, b) => b.total - a.total);

      if (!list.length) {
        tbody.innerHTML = "";
        empty.hidden = false;
      } else {
        empty.hidden = true;
        tbody.innerHTML = list.map((u) => `
          <tr>
            <td>${u.usuario}</td>
            <td style="color:#15803d;font-weight:700">${u.aprovado}</td>
            <td style="color:#dc2626;font-weight:700">${u.reprovado}</td>
            <td style="font-weight:700">${u.total}</td>
          </tr>
        `).join("");
      }

      renderMotivosTable(topMotivos);

      YardexDash.showStatus(
        statusEl,
        `${filtered.length} inspeção(ões) no período · ${allRows.length} carregada(s).`,
        false
      );
    }

    async function loadData() {
      YardexDash.showStatus(statusEl, "Carregando dados…", false);
      try {
        const json = await YardexDash.fetchWebhook(API_URL);
        const mapped = YardexDash.normalizeRows(json)
          .map(mapRow)
          .filter(Boolean)
          .filter((r) => r.data_pedido_sankhya);
        allRows = mapped;
        YardexDash.showStatus(statusEl, `${mapped.length} inspeção(ões) carregada(s).`, false);
        renderDashboard();
      } catch (err) {
        YardexDash.showStatus(statusEl, `Erro: ${err.message}`, true);
        ["kpiAprovado", "kpiReprovado", "kpiTotal"].forEach((id) => {
          document.getElementById(id).textContent = "0";
        });
        document.getElementById("tableBody").innerHTML = "";
        document.getElementById("tableEmpty").hidden = false;
        renderMotivosTable([]);
      }
    }

    const { reload } = YardexDash.bindDateFilters({ onChange: renderDashboard, onReload: loadData });
    reload();
  </script>
</body>
</html>
