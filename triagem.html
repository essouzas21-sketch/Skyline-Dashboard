<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triagem</title>
  <link rel="stylesheet" href="yardex-dash.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="yardex-dash.js"></script>
</head>
<body>
  <div class="page">
    <a class="back" href="menu.html">← Voltar ao menu</a>
    <header class="header">
      <h1>Triagem</h1>
      <p class="subtitle" id="periodLabel">Carregando período…</p>
    </header>

    <div class="filter-row">
      <label>Data inicial <input type="date" id="dateStart" /></label>
      <label>Data final <input type="date" id="dateEnd" /></label>
      <button type="button" class="primary" id="btnApply">Atualizar</button>
      <button type="button" id="btnToday">Hoje</button>
      <button type="button" id="btnReload">Recarregar dados</button>
    </div>

    <div id="statusMsg" class="status" hidden></div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="label">Triagens no período</div>
        <div class="value" id="kpiTotal">0</div>
      </div>
    </div>

    <div class="panel">
      <h2>Triagens por usuário</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Usuário triagem</th>
              <th>Quantidade</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="tableEmpty" class="empty" hidden>Nenhuma triagem no período selecionado.</div>
    </div>

    <div class="panel">
      <h2>Principais marcas triadas</h2>
      <div class="chart-box"><canvas id="chartMarca"></canvas></div>
    </div>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const API_URL = "https://datalake.yardex.pro:10000/webhook/30e00080-9b5d-4db8-9d2a-e40d71b8cd5d";
    const DATE_FIELD = "data_triagem";
    const TOP_MARCAS = 12;
    const statusEl = document.getElementById("statusMsg");

    let allRows = [];
    let chartMarca = null;

    function mapRow(raw) {
      return {
        data_triagem: raw["Data Triagem"] || raw.data_triagem || null,
        usuario: raw["Usuário triagem"] || raw.usuario_triagem || raw.u?.name || "—",
        descricao: raw.descricao || "—",
        serial: raw.serial || "—",
        hu: raw.hu || "—"
      };
    }

    function renderUserTable(rows) {
      const tbody = document.getElementById("tableBody");
      const empty = document.getElementById("tableEmpty");
      const byUser = YardexDash.aggregateCount(rows, (r) => r.usuario);

      if (!byUser.length) {
        tbody.innerHTML = "";
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      tbody.innerHTML = byUser
        .map(([usuario, qtd]) => `
          <tr>
            <td>${usuario}</td>
            <td style="font-weight:700;color:var(--bg)">${qtd}</td>
          </tr>
        `)
        .join("");
    }

    function renderDashboard() {
      const { start, end } = YardexDash.getDateRange();
      if (!start || !end) return;
      if (start > end) {
        YardexDash.showStatus(statusEl, "A data inicial não pode ser maior que a data final.", true);
        return;
      }

      const filtered = YardexDash.filterByDateField(allRows, start, end, DATE_FIELD);
      const byBrand = YardexDash.aggregateCount(filtered, (r) => YardexDash.extractFirstWord(r.descricao))
        .slice(0, TOP_MARCAS);

      document.getElementById("kpiTotal").textContent = filtered.length;
      document.getElementById("periodLabel").textContent =
        `Período: ${YardexDash.formatPeriodBR(start, end)} · filtro por Data Triagem`;

      chartMarca = YardexDash.createBarChart(
        "chartMarca",
        chartMarca,
        byBrand.map((x) => x[0]),
        byBrand.map((x) => x[1]),
        "#8b6bb8"
      );

      renderUserTable(filtered);
      YardexDash.showStatus(
        statusEl,
        `Exibindo ${filtered.length} triagem(ns) no período · ${allRows.length} no total carregado.`,
        false
      );
    }

    async function loadData() {
      YardexDash.showStatus(statusEl, "Carregando dados do endpoint…", false);
      try {
        const json = await YardexDash.fetchWebhook(API_URL);
        allRows = YardexDash.normalizeRows(json)
          .map(mapRow)
          .filter((r) => r.data_triagem);
        YardexDash.showStatus(statusEl, `Dados carregados: ${allRows.length} triagem(ns).`, false);
        renderDashboard();
      } catch (err) {
        YardexDash.showStatus(statusEl, `Erro ao carregar: ${err.message}. Use http://localhost (CORS).`, true);
        document.getElementById("kpiTotal").textContent = "0";
        chartMarca = YardexDash.createBarChart("chartMarca", chartMarca, [], []);
        renderUserTable([]);
      }
    }

    YardexDash.bindDateFilters({ onChange: renderDashboard, onReload: loadData });
    loadData();
  </script>
</body>
</html>
