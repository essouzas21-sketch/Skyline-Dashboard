<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triagem</title>
  <link rel="stylesheet" href="yardex-dash.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="yardex-version.js?v=2"></script>
  <script src="yardex-dash.js?v=49"></script>
</head>
<body class="dash-page">
  <div class="page">
    <div class="dash-toolbar">
      <a class="back" href="menu.html">← Menu</a>
      <div class="dash-title">
        <h1>Triagem</h1>
        <p class="subtitle" id="periodLabel">Carregando período…</p>
      </div>
      <div class="filter-row">
        <label>Data inicial <input type="date" id="dateStart" /></label>
        <label>Data final <input type="date" id="dateEnd" /></label>
        <button type="button" class="primary" id="btnApply">Atualizar</button>
        <button type="button" id="btnToday">Hoje</button>
        <button type="button" id="btnReload">Recarregar</button>
      </div>
    </div>

    <div id="statusMsg" class="status" hidden></div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="label">Aparelhos triados no período</div>
        <div class="value" id="kpiTotal">0</div>
      </div>
      <div class="kpi-card">
        <div class="label" id="monthRowLabel">Aparelhos triados no mês</div>
        <div class="value" id="kpiTotalMes">0</div>
      </div>
    </div>

    <div class="dash-main dash-main--triagem">
      <div class="panel">
        <h2>Triagens por usuário</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Usuário</th>
                <th>Qtd</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="tableEmpty" class="empty" hidden>Nenhuma triagem no período.</div>
      </div>

      <div class="panel">
        <h2>Principais marcas triadas</h2>
        <div class="chart-box"><canvas id="chartMarca"></canvas></div>
      </div>

      <div class="panel panel--hour">
        <h2>Triagens por hora — Data Triagem (08h–17h)</h2>
        <div class="chart-box chart-box--hour"><canvas id="chartHora"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const API_URL = YardexDash.API_REPARO;
    const DATE_FIELD = "data_triagem";
    const ETAPAS_PERMITIDAS = YardexDash.ETAPAS_OPERACAO;
    const TOP_MARCAS = 12;
    const statusEl = document.getElementById("statusMsg");

    const HOUR_FROM = 7;
    const HOUR_TO = 17;
    let allRows = [];
    let chartMarca = null;
    let chartHora = null;

    function mapRow(raw) {
      return {
        id: raw.id ?? null,
        data_triagem: raw["Data Triagem"] || raw.data_triagem || null,
        operacao: YardexDash.resolveOperacao(raw),
        usuario: YardexDash.normalizeUserName(
          raw["Usuário triagem"] ||
          raw["Usuário reparo"] ||
          raw.usuario_triagem ||
          raw.u?.name ||
          "—"
        ),
        descricao: raw.descricao || "—",
        serial: raw.serial || "—",
        hu: raw.hu || "—"
      };
    }

    function passesTriagemRules(row) {
      return !!row.data_triagem && ETAPAS_PERMITIDAS.has(row.operacao);
    }

    function getMonthRange(refISO) {
      const [y, m] = refISO.split("-");
      const lastDay = new Date(Number(y), Number(m), 0).getDate();
      return {
        start: `${y}-${m}-01`,
        end: `${y}-${m}-${String(lastDay).padStart(2, "0")}`
      };
    }

    function monthLabel(refISO) {
      const [y, m] = refISO.split("-");
      const names = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
      return `${names[Number(m) - 1]}/${y}`;
    }

    function renderUserTable(rows) {
      const tbody = document.getElementById("tableBody");
      const empty = document.getElementById("tableEmpty");
      const byUser = YardexDash.aggregateCount(rows, (r) => r.usuario);

      if (!byUser.length) {
        tbody.innerHTML = "";
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      tbody.innerHTML = byUser
        .map(([usuario, qtd]) => `
          <tr>
            <td>${usuario}</td>
            <td style="font-weight:700;color:var(--bg)">${qtd}</td>
          </tr>
        `)
        .join("");
    }

    function renderDashboard() {
      const { start, end } = YardexDash.getDateRange();
      if (!start || !end) return;
      if (start > end) {
        YardexDash.showStatus(statusEl, "A data inicial não pode ser maior que a data final.", true);
        return;
      }

      const filtered = YardexDash.filterByDateField(allRows, start, end, DATE_FIELD);
      const dashRows = YardexDash.distinctById(filtered, "id");

      const month = getMonthRange(end);
      const inMonth = YardexDash.filterByDateField(allRows, month.start, month.end, DATE_FIELD);
      const dashRowsMes = YardexDash.distinctById(inMonth, "id");

      const byBrand = YardexDash.aggregateCount(dashRows, (r) => YardexDash.extractFirstWord(r.descricao))
        .slice(0, TOP_MARCAS);
      const byHour = YardexDash.aggregateHourBuckets(dashRows, DATE_FIELD, HOUR_FROM, HOUR_TO);

      document.getElementById("kpiTotal").textContent = dashRows.length;
      document.getElementById("kpiTotalMes").textContent = dashRowsMes.length;
      document.getElementById("monthRowLabel").textContent = `Aparelhos triados no mês — ${monthLabel(end)}`;
      document.getElementById("periodLabel").textContent =
        `Período: ${YardexDash.formatPeriodBR(start, end)} · Data Triagem · operação reparo/gestao_pecas`;

      chartMarca = YardexDash.createBarChart(
        "chartMarca",
        chartMarca,
        byBrand.map((x) => x[0]),
        byBrand.map((x) => x[1]),
        "#8b6bb8"
      );

      chartHora = YardexDash.createLineChart(
        "chartHora",
        chartHora,
        byHour.map((x) => x[0]),
        YardexDash.maskFutureHourLineValues(byHour, end, HOUR_FROM, HOUR_TO),
        "#694992"
      );

      renderUserTable(dashRows);
      YardexDash.showStatus(
        statusEl,
        `${dashRows.length} aparelho(s) no período · ${dashRowsMes.length} no mês · distinct por id.`,
        false
      );
    }

    async function loadData() {
      YardexDash.showStatus(statusEl, "Carregando dados…", false);
      try {
        const json = await YardexDash.fetchWebhook(API_URL);
        const mapped = YardexDash.normalizeRows(json)
          .filter((raw) => YardexDash.passesTriagemRaw(raw))
          .map(mapRow);
        allRows = mapped;
        YardexDash.showStatus(statusEl, `${allRows.length} registro(s) carregado(s).`, false);
        renderDashboard();
      } catch (err) {
        YardexDash.showStatus(statusEl, `Erro: ${err.message}`, true);
        document.getElementById("kpiTotal").textContent = "0";
        document.getElementById("kpiTotalMes").textContent = "0";
        chartMarca = YardexDash.createBarChart("chartMarca", chartMarca, [], []);
        chartHora = YardexDash.createLineChart("chartHora", chartHora, [], []);
        renderUserTable([]);
      }
    }

    const { reload } = YardexDash.bindDateFilters({ onChange: renderDashboard, onReload: loadData });
  </script>
</body>
</html>
