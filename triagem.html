<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triagem</title>
  <link rel="stylesheet" href="yardex-dash.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="yardex-dash.js?v=15"></script>
</head>
<body class="dash-page">
  <div class="page">
    <div class="dash-toolbar">
      <a class="back" href="menu.html">← Menu</a>
      <div class="dash-title">
        <h1>Triagem</h1>
        <p class="subtitle" id="periodLabel">Carregando período…</p>
      </div>
      <div class="filter-row">
        <label>Data inicial <input type="date" id="dateStart" /></label>
        <label>Data final <input type="date" id="dateEnd" /></label>
        <button type="button" class="primary" id="btnApply">Atualizar</button>
        <button type="button" id="btnToday">Hoje</button>
        <button type="button" id="btnReload">Recarregar</button>
      </div>
    </div>

    <div id="statusMsg" class="status" hidden></div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="label">Triagens no período</div>
        <div class="value" id="kpiTotal">0</div>
      </div>
    </div>

    <div class="dash-main dash-main--triagem">
      <div class="panel">
        <h2>Triagens por usuário</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Usuário</th>
                <th>Qtd</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="tableEmpty" class="empty" hidden>Nenhuma triagem no período.</div>
      </div>

      <div class="panel">
        <h2>Principais marcas triadas</h2>
        <div class="chart-box"><canvas id="chartMarca"></canvas></div>
      </div>

      <div class="panel panel--hour">
        <h2>Triagens por hora — DATA_PEDIDO_SANKHYA (07h–17h)</h2>
        <div class="chart-box chart-box--hour"><canvas id="chartHora"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const API_URL = "https://datalake.yardex.pro:10000/webhook/30e00080-9b5d-4db8-9d2a-e40d71b8cd5d";
    const DATE_FIELD = "data_pedido_sankhya";
    const ETAPAS_PERMITIDAS = new Set(["reparo", "gestao_pecas"]);
    const TOP_MARCAS = 12;
    const statusEl = document.getElementById("statusMsg");

    const HOUR_FIELD = DATE_FIELD;
    const HOUR_FROM = 7;
    const HOUR_TO = 17;
    let allRows = [];
    let chartMarca = null;
    let chartHora = null;

    function mapRow(raw) {
      return {
        id: raw.id ?? null,
        data_pedido_sankhya: raw.DATA_PEDIDO_SANKHYA || raw.data_pedido_sankhya || null,
        status_sankhya: raw.STATUS_SANKHYA || raw.status_sankhya || null,
        etapa_origem: raw.etapa_origem || raw.ETAPA_ORIGEM || null,
        usuario: YardexDash.normalizeUserName(
          raw["Usuário triagem"] ||
          raw["Usuário reparo"] ||
          raw.usuario_triagem ||
          raw.u?.name ||
          "—"
        ),
        descricao: raw.descricao || "—",
        serial: raw.serial || "—",
        hu: raw.hu || "—"
      };
    }

    function passesTriagemRules(row) {
      const status = String(row.status_sankhya || "").trim().toLowerCase();
      const etapa = String(row.etapa_origem || "").trim().toLowerCase();
      return status === "sucesso" && ETAPAS_PERMITIDAS.has(etapa) && !!row.data_pedido_sankhya;
    }

    function renderUserTable(rows) {
      const tbody = document.getElementById("tableBody");
      const empty = document.getElementById("tableEmpty");
      const byUser = YardexDash.aggregateCount(rows, (r) => r.usuario);

      if (!byUser.length) {
        tbody.innerHTML = "";
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      tbody.innerHTML = byUser
        .map(([usuario, qtd]) => `
          <tr>
            <td>${usuario}</td>
            <td style="font-weight:700;color:var(--bg)">${qtd}</td>
          </tr>
        `)
        .join("");
    }

    function renderDashboard() {
      const { start, end } = YardexDash.getDateRange();
      if (!start || !end) return;
      if (start > end) {
        YardexDash.showStatus(statusEl, "A data inicial não pode ser maior que a data final.", true);
        return;
      }

      const filtered = YardexDash.filterByDateField(allRows, start, end, DATE_FIELD);
      const byBrand = YardexDash.aggregateCount(filtered, (r) => YardexDash.extractFirstWord(r.descricao))
        .slice(0, TOP_MARCAS);
      const byHour = YardexDash.aggregateHourBuckets(filtered, HOUR_FIELD, HOUR_FROM, HOUR_TO);

      document.getElementById("kpiTotal").textContent = filtered.length;
      document.getElementById("periodLabel").textContent =
        `Período: ${YardexDash.formatPeriodBR(start, end)} · DATA_PEDIDO_SANKHYA · SUCESSO · reparo/gestao_pecas`;

      chartMarca = YardexDash.createBarChart(
        "chartMarca",
        chartMarca,
        byBrand.map((x) => x[0]),
        byBrand.map((x) => x[1]),
        "#8b6bb8"
      );

      chartHora = YardexDash.createLineChart(
        "chartHora",
        chartHora,
        byHour.map((x) => x[0]),
        YardexDash.maskFutureHourLineValues(byHour, end, HOUR_FROM, HOUR_TO),
        "#694992"
      );

      renderUserTable(filtered);
      YardexDash.showStatus(
        statusEl,
        `${filtered.length} triagem(ns) no período · ${allRows.length} elegível(is) após filtros.`,
        false
      );
    }

    async function loadData() {
      YardexDash.showStatus(statusEl, "Carregando dados…", false);
      try {
        const json = await YardexDash.fetchWebhook(API_URL);
        const mapped = YardexDash.normalizeRows(json).map(mapRow).filter(passesTriagemRules);
        allRows = YardexDash.distinctById(mapped, "id");
        YardexDash.showStatus(statusEl, `${allRows.length} única(s) · ${mapped.length} bruta(s).`, false);
        renderDashboard();
      } catch (err) {
        YardexDash.showStatus(statusEl, `Erro: ${err.message}`, true);
        document.getElementById("kpiTotal").textContent = "0";
        chartMarca = YardexDash.createBarChart("chartMarca", chartMarca, [], []);
        chartHora = YardexDash.createLineChart("chartHora", chartHora, [], []);
        renderUserTable([]);
      }
    }

    const { reload } = YardexDash.bindDateFilters({ onChange: renderDashboard, onReload: loadData });
    reload();
  </script>
</body>
</html>
