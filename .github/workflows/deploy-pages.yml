# Deploy estático via GitHub Actions (contorna o pages-build-deployment em timeout).
#
# Opção A (recomendada): Settings → Pages → Source → GitHub Actions
# Opção B (backup): Settings → Pages → Source → Deploy from a branch → gh-pages / (root)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'data' \
            --exclude 'scripts' \
            --exclude 'docs' \
            --exclude '*.sh' \
            --exclude 'DOCUMENTACAO-ISO-AUDIT.md' \
            --exclude 'DOCUMENTACAO-ISO-AUDIT.pdf' \
            --exclude 'DOCUMENTACAO-ISO-AUDIT.html' \
            --exclude '.DS_Store' \
            ./ _site/
          touch _site/.nojekyll
          echo "Prepared $(find _site -type f | wc -l) files"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 2

  deploy-actions:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 4

  # Backup: publica branch gh-pages (útil se Source ainda for "branch")
  deploy-branch:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
          commit_message: "deploy: sync site from main"
