<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análise da Produção Skyline</title>
  <style>
    :root {
      --bg: #694992;
      --card: #ffffff;
      --text-on-bg: #ffffff;
      --text-on-card: #2d1f42;
      --accent: #c4a8e8;
      --accent-strong: #8b6bb8;
      --shadow: 0 8px 28px rgba(45, 31, 66, 0.25);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-on-bg);
      padding: 24px;
    }

    .page-header {
      margin-bottom: 32px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .page-header .subtitle {
      margin: 0;
      color: var(--accent);
      font-size: 0.95rem;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 88px;
      padding: 20px 24px;
      background: var(--card);
      color: var(--text-on-card);
      text-decoration: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .menu-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 12px 32px rgba(45, 31, 66, 0.35);
    }

    .menu-btn:active {
      transform: translateY(-1px);
    }

    .menu-btn .badge {
      display: block;
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-strong);
    }

    .menu-btn.ready .badge { color: #15803d; }
    .menu-btn.pending .badge { color: #9b7bc4; }

  </style>
</head>
<body>
  <header class="page-header">
    <h1>ANALISE DA PRODUÇÃO SKYLINE</h1>
    <p class="subtitle">Selecione o módulo desejado</p>
  </header>

  <div class="wrap">
    <nav class="menu-grid">
      <a class="menu-btn ready" href="recebimento.html">
        Recebimento
        <span class="badge">Dashboard ativo</span>
      </a>
      <a class="menu-btn ready" href="triagem.html">
        Triagem
        <span class="badge">Dashboard ativo</span>
      </a>
      <a class="menu-btn pending" href="gestao-produto.html">
        Gestão de Produto
        <span class="badge">Em breve</span>
      </a>
      <a class="menu-btn ready" href="producao-diversas-marcas.html">
        Produção Diversas Marcas
        <span class="badge">Dashboard ativo</span>
      </a>
      <a class="menu-btn ready" href="producao-iphone.html">
        Produção iPhone
        <span class="badge">Dashboard ativo</span>
      </a>
      <a class="menu-btn ready" href="cqe.html">
        CQE
        <span class="badge">Dashboard ativo</span>
      </a>
    </nav>
  </div>

</body>
</html>
