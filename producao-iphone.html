<!doctype html>
<html lang="pt-BR">
<head>
    <script src="skyline-auth.js?v=6"></script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produção 6 — Almir · Thaís Mazoline · Kauan</title>
  <link rel="stylesheet" href="skyline-dash.css" />
  <script src="skyline-version.js?v=2"></script>
  <script src="skyline-dash.js?v=71"></script>
  <script src="skyline-producao.js?v=47"></script>
  <style>
    .kpi-card.finalizado .value { color: #15803d; }
    .kpi-card.andamento .value { color: #1d4ed8; }
    .kpi-card.pausado .value { color: #b45309; }
    .kpi-card.total .value { color: var(--bg); }
  </style>
</head>
<body class="dash-page">
  <div class="page">
    <div class="dash-toolbar">
      <a class="back" href="menu.html">← Menu</a>
      <div class="dash-title">
        <h1>Produção 6</h1>
        <p class="subtitle" id="periodLabel">PROD 16 — Almir · PROD 17 — Thaís Mazoline · PROD 18 — Kauan</p>
      </div>
      <div class="filter-row">
        <label>Data inicial <input type="date" id="dateStart" /></label>
        <label>Data final <input type="date" id="dateEnd" /></label>
        <button type="button" class="primary" id="btnApply">Atualizar</button>
        <button type="button" id="btnToday">Hoje</button>
        <button type="button" id="btnReload">Recarregar</button>
      </div>
    </div>

    <div id="statusMsg" class="status" hidden></div>

    <div class="kpi-row">
      <div class="kpi-card finalizado">
        <div class="label">Finalizados</div>
        <div class="value" id="kpiFinalizado">0</div>
      </div>
      <div class="kpi-card andamento">
        <div class="label">Em andamento</div>
        <div class="value" id="kpiAndamento">0</div>
      </div>
      <div class="kpi-card pausado">
        <div class="label">Pausados</div>
        <div class="value" id="kpiPausado">0</div>
      </div>
      <div class="kpi-card total">
        <div class="label">Total</div>
        <div class="value" id="kpiTotal">0</div>
      </div>
    </div>

    <div class="dash-main dash-main--table-only">
      <div class="panel">
        <h2>Produção por colaborador</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Colaborador</th>
                <th title="Transferidos para o endereço PROD do técnico no dia (período)">Receb. Dia</th>
                <th title="Na bancada (endereço PROD), ainda não iniciado e que entrou em dias anteriores — o que entrou hoje está no Receb. Dia">Acumulado</th>
                <th>Em andamento</th>
                <th>Pausados</th>
                <th>Finalizados</th>
                <th title="Todos os prontos que ainda não foram para o CQE (no PROD ou PROD PRONTO, de qualquer dia)">Prontos</th>
                <th>Total</th>
                <th>Tempo trabalhado</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="tableEmpty" class="empty" hidden>Nenhum aparelho no período.</div>
      </div>
    </div>
  </div>

  <script>
    ProducaoDash.initAndroidPage(5);
  </script>
</body>
</html>
